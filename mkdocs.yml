site_name: Manual de Tomada de Contas Especial
site_description: Projeto independente de consulta e disseminação de conhecimentos sobre Tomada de Contas Especial.
site_url: https://dcactce.github.io/manual-tomada-de-contas-especial/
site_author: DCACTCE

repo_url: https://github.com/DCACTCE/manual-tomada-de-contas-especial

docs_dir: docs

theme:
  name: material
  language: pt
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para o modo escuro
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para o modo claro

plugins:
  - search:
      lang:
