site_name: Manual de Tomada de Contas Especial
site_description: Projeto independente de organização e disseminação de conhecimentos sobre Tomada de Contas Especial.
site_url: https://dcactce.github.io/manual-tomada-de-contas-especial/
site_author: DCACTCE

repo_url: https://github.com/DCACTCE/manual-tomada-de-contas-especial

docs_dir: docs

theme:
  name: material
  language: pt
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para o modo escuro
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para o modo claro

plugins:
  - search:
      lang:
        - pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - O Manual:
      - Introdução e legislação: manual/capitulo-01.md
      - Conceitos fundamentais: manual/capitulo-02.md
      - Caracterização da TCE: manual/capitulo-03.md
      - Pressupostos e medidas preliminares: manual/capitulo-04.md
      - Instauração da TCE: manual/capitulo-05.md
      - Fases e prescrição: manual/capitulo-06.md
  - Documentos de referência:
      - Referências normativas: documentos.md
  - Sobre o projeto: sobre.md

copyright: Projeto independente. Conteúdo informativo e educativo.
